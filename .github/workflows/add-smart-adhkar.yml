name: Add Smart Contextual Adhkar
on:
  push:
    paths: ['.github/workflows/add-smart-adhkar.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add smart adhkar
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function SmartAdhkar({' not in s:
              marker='function NotificationCenter({' if 'function NotificationCenter({' in s else 'function FeaturePreview('
              comp=r'''function SmartAdhkar({lang,go}){
  const now=new Date(),h=now.getHours();
  const profile=(()=>{try{return localStorage.getItem("sakinah-active-profile")||"me"}catch{return "me"}})();
  const key=`sakinah-smart-adhkar-${profile}`;
  const [count,setCount]=useState(0),[mode,setMode]=useState(()=>h<11?"morning":h<17?"day":h<21?"evening":"sleep"),[last,setLast]=useState(()=>{try{return localStorage.getItem(key)||""}catch{return ""}});
  const packs={
    morning:{titleAr:"أذكار الصباح",titleEn:"Morning Adhkar",items:["أصبحنا وأصبح الملك لله","سبحان الله وبحمده","رضيت بالله رباً وبالإسلام ديناً وبمحمد ﷺ نبياً"]},
    day:{titleAr:"ذكر مناسب الآن",titleEn:"Dhikr for now",items:["أستغفر الله","لا حول ولا قوة إلا بالله","اللهم صل وسلم على نبينا محمد"]},
    evening:{titleAr:"أذكار المساء",titleEn:"Evening Adhkar",items:["أمسينا وأمسى الملك لله","سبحان الله وبحمده","أعوذ بكلمات الله التامات من شر ما خلق"]},
    sleep:{titleAr:"أذكار النوم",titleEn:"Sleep Adhkar",items:["باسمك اللهم أموت وأحيا","سبحان الله ٣٣ · الحمد لله ٣٣ · الله أكبر ٣٤","اللهم قني عذابك يوم تبعث عبادك"]},
    afterPrayer:{titleAr:"أذكار ما بعد الصلاة",titleEn:"After Prayer",items:["أستغفر الله · أستغفر الله · أستغفر الله","اللهم أنت السلام ومنك السلام","سبحان الله ٣٣ · الحمد لله ٣٣ · الله أكبر ٣٣"]},
    travel:{titleAr:"أذكار السفر",titleEn:"Travel Adhkar",items:["سبحان الذي سخر لنا هذا وما كنا له مقرنين","اللهم إنا نسألك في سفرنا هذا البر والتقوى"]},
    home:{titleAr:"أذكار المنزل",titleEn:"Home Adhkar",items:["بسم الله ولجنا وبسم الله خرجنا وعلى ربنا توكلنا"]},
    mosque:{titleAr:"أذكار المسجد",titleEn:"Mosque Adhkar",items:["اللهم افتح لي أبواب رحمتك","اللهم إني أسألك من فضلك"]}
  };
  const pack=packs[mode]||packs.day; const [idx,setIdx]=useState(0); const text=pack.items[idx%pack.items.length];
  const tap=()=>{setCount(v=>v+1);try{navigator.vibrate?.(12)}catch{};try{localStorage.setItem(key,text);setLast(text)}catch{}};
  return <SectionShell lang={lang} go={go} back="home" titleAr="الأذكار الذكية" titleEn="Smart Adhkar" subtitleAr="أذكار تظهر بحسب الوقت والسياق" subtitleEn="Adhkar that adapts to time and context">
    <div style={{marginTop:18,padding:18,borderRadius:22,background:"rgba(181,154,98,.10)",border:"1px solid rgba(181,154,98,.18)"}}><div style={{fontSize:10,opacity:.46}}>{lang==="ar"?"مقترح لك الآن":"Suggested now"}</div><div className="font-editorial" style={{fontSize:23,marginTop:7}}>{lang==="ar"?pack.titleAr:pack.titleEn}</div><div style={{fontSize:12,opacity:.5,marginTop:5}}>{now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
    <div style={{marginTop:14,display:"flex",gap:7,overflowX:"auto",paddingBottom:4}}>{[["morning","الصباح","Morning"],["afterPrayer","بعد الصلاة","After prayer"],["evening","المساء","Evening"],["sleep","النوم","Sleep"],["travel","السفر","Travel"],["home","المنزل","Home"],["mosque","المسجد","Mosque"]].map(([id,ar,en])=><button key={id} onClick={()=>{setMode(id);setIdx(0);setCount(0)}} style={{flexShrink:0,padding:"8px 11px",borderRadius:14,border:mode===id?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.09)",background:mode===id?"rgba(181,154,98,.1)":"transparent",fontFamily:"inherit"}}>{lang==="ar"?ar:en}</button>)}</div>
    <button onClick={tap} style={{width:"100%",marginTop:16,minHeight:220,borderRadius:28,border:"1px solid rgba(16,16,15,.08)",background:"linear-gradient(145deg,rgba(255,255,255,.65),rgba(181,154,98,.09))",fontFamily:"inherit",color:"inherit",padding:22}}><div style={{fontSize:11,opacity:.45}}>{lang==="ar"?"اضغط للتسبيح":"Tap to count"}</div><div className="font-quran" style={{fontSize:25,lineHeight:1.9,marginTop:18}}>{text}</div><div className="font-editorial" style={{fontSize:34,marginTop:20}}>{nDigits(count,lang)}</div></button>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}><button onClick={()=>{setIdx(v=>(v+1)%pack.items.length);setCount(0)}} style={{padding:11,borderRadius:14,border:"1px solid rgba(16,16,15,.09)",background:"transparent",fontFamily:"inherit"}}>{lang==="ar"?"ذكر آخر":"Another dhikr"}</button><button onClick={()=>go("interactive-tasbeeh")} style={{padding:11,borderRadius:14,border:"1px solid rgba(16,16,15,.09)",background:"transparent",fontFamily:"inherit"}}>{lang==="ar"?"فتح المسبحة":"Open Tasbeeh"}</button></div>
    {last&&<div style={{marginTop:14,padding:13,borderRadius:14,border:"1px solid rgba(16,16,15,.07)",fontSize:10.5,opacity:.55}}>{lang==="ar"?"آخر ذكر قرأته: ":"Last read: "}{last}</div>}
    <div style={{marginTop:14,fontSize:10,lineHeight:1.7,opacity:.43}}>{lang==="ar"?"المحرك يختار افتراضياً حسب الوقت، ويمكن للمستخدم تغيير السياق يدوياً. وعند ربط مواقيت الصلاة والموقع في نسخة الهاتف يمكن إظهار أذكار ما بعد الصلاة والسفر والمسجد تلقائياً بصورة أدق.":"The engine defaults by time and lets the user switch context manually. In the phone build, prayer times and location can refine after-prayer, travel and mosque suggestions."}</div>
  </SectionShell>;
}

'''
              s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"smart-adhkar":' not in s:s=s.replace(route,route+'\n    "smart-adhkar": () => <SmartAdhkar lang={lang} go={go} />,',1)
            needle='{ id: "notification-center", label: lang === "ar" ? "تنبيهات الصلاة والأذكار" : "Prayer & Dhikr Alerts", action: () => go("notification-center") },'
            entry='{ id: "smart-adhkar", label: lang === "ar" ? "الأذكار الذكية" : "Smart Adhkar", action: () => go("smart-adhkar") },'
            if needle in s and entry not in s:s=s.replace(needle,needle+'\n    '+entry,1)
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add smart contextual adhkar experience" && git push; fi
