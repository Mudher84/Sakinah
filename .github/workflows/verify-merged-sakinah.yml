name: Verify Merged Sakinah
on:
  push:
    paths:
      - 'src/MergedSakinah.jsx'
      - 'src/main.jsx'
      - 'src/trustedDaily.jsx'
      - 'src/kidsWorld.jsx'
      - 'src/offlineBackup.jsx'
      - '.github/workflows/verify-merged-sakinah.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit merged runtime
        run: |
          grep -q 'MergedSakinah' src/main.jsx
          grep -q 'TrustedDailyHub' src/MergedSakinah.jsx
          grep -q 'KidsWorldHub' src/MergedSakinah.jsx
          grep -q 'OfflineBackupCenter' src/MergedSakinah.jsx
          if grep -q 'aria-label="Integrated Sakinah modules"' src/MergedSakinah.jsx; then
            echo 'Legacy floating integration button still exists' >&2
            exit 1
          fi
      - name: Stamp verified build
        run: |
          mkdir -p build-status
          printf 'MERGED_SAKINAH_BUILD=PASS\nSOURCE_SHA=%s\n' "$GITHUB_SHA" > build-status/merged-sakinah.txt
          git config user.name 'Sakinah Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add build-status/merged-sakinah.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Verify merged Sakinah build'
            git push
          fi
