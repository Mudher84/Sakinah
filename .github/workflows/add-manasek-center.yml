name: Add Manasek Center
on:
  push:
    paths: ['.github/workflows/add-manasek-center.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add Hajj and Umrah Manasek center
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function ManasekCenter({' not in s:
              marker='function ZakatCalculator({' if 'function ZakatCalculator({' in s else 'function FeaturePreview('
              comp=r'''function ManasekCenter({ lang, go }) {
  const [mode,setMode]=useState("hajj"),[done,setDone]=useState({});
  const hajj=["الاستعداد والإحرام","النية والتلبية","دخول مكة والمسجد الحرام","طواف القدوم","السعي بين الصفا والمروة","يوم التروية · منى","الوقوف بعرفة","المبيت بمزدلفة","رمي جمرة العقبة","الهدي والحلق أو التقصير","طواف الإفاضة","أيام التشريق ورمي الجمرات","طواف الوداع"];
  const umrah=["الاستعداد للإحرام","الإحرام من الميقات","النية والتلبية","دخول المسجد الحرام","الطواف سبعة أشواط","ركعتا الطواف","السعي بين الصفا والمروة","الحلق أو التقصير والتحلل"];
  const steps=mode==="hajj"?hajj:umrah;
  const toggle=i=>setDone(x=>({...x,[`${mode}-${i}`]:!x[`${mode}-${i}`]}));
  return <SectionShell lang={lang} go={go} back="discover" titleAr="مناسك" titleEn="Manasek" subtitleAr="دليل الحج والعمرة خطوة بخطوة" subtitleEn="Hajj & Umrah step-by-step guide">
    <div style={{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["hajj","الحج","Hajj"],["umrah","العمرة","Umrah"]].map(([id,ar,en])=><button key={id} onClick={()=>setMode(id)} style={{padding:13,borderRadius:16,border:mode===id?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.1)",background:mode===id?"rgba(181,154,98,.1)":"rgba(255,255,255,.4)",fontFamily:"inherit",fontWeight:600}}>{lang==="ar"?ar:en}</button>)}</div>
    <div style={{marginTop:18}}>{steps.map((x,i)=>{const yes=!!done[`${mode}-${i}`];return <button key={x} onClick={()=>toggle(i)} style={{width:"100%",display:"grid",gridTemplateColumns:"38px 1fr auto",gap:11,alignItems:"center",padding:"13px 0",border:0,borderTop:"1px solid rgba(16,16,15,.08)",background:"transparent",textAlign:lang==="ar"?"right":"left",fontFamily:"inherit",color:"inherit"}}><div style={{width:32,height:32,borderRadius:"50%",display:"grid",placeItems:"center",border:yes?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.14)",background:yes?"rgba(181,154,98,.12)":"transparent",fontSize:10}}>{yes?"✓":nDigits(i+1,lang)}</div><div><div style={{fontSize:13.5,fontWeight:600}}>{x}</div><div style={{fontSize:10.5,opacity:.44,marginTop:4}}>{lang==="ar"?"شرح · أدعية · تنبيهات":"Guide · Duas · Notes"}</div></div><span style={{opacity:.35}}>›</span></button>})}</div>
    <div style={{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>{[["أدعية المناسك","Duas"],["خريطة المشاعر","Holy sites map"],["عداد الطواف","Tawaf counter"],["عداد السعي","Sa'i counter"],["عداد الجمرات","Jamarat counter"],["قائمة التجهيز","Packing list"],["حفظ التقدم","Save progress"],["إرشادات السلامة","Safety guide"]].map(([ar,en])=><div key={en} style={{border:"1px solid rgba(16,16,15,.08)",borderRadius:14,padding:13,minHeight:68}}><div style={{fontSize:12,fontWeight:600}}>{lang==="ar"?ar:en}</div><div style={{marginTop:7}}><FeatureStatus lang={lang} status="verified"/></div></div>)}</div>
  </SectionShell>;
}

'''
              s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"manasek-center":' not in s:s=s.replace(route,route+'\n    "manasek-center": () => <ManasekCenter lang={lang} go={go} />,',1)
            needle='{ id: "zakat-calculator", label: lang === "ar" ? "ميزان الزكاة · زكاة الفطر" : "Zakat · Zakat al-Fitr", action: () => go("zakat-calculator") },'
            entry='{ id: "manasek-center", label: lang === "ar" ? "مناسك · الحج والعمرة" : "Manasek · Hajj & Umrah", action: () => go("manasek-center") },'
            if needle in s and entry not in s:s=s.replace(needle,needle+'\n    '+entry,1)
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add Hajj and Umrah Manasek center" && git push; fi
