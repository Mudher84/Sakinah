name: Verify Search and Library
on:
  push:
    paths:
      - 'src/searchLibrary.jsx'
      - 'src/MergedSakinah.jsx'
      - '.github/workflows/verify-search-library.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit search and library routes
        run: |
          grep -q 'UniversalIslamicSearch' src/MergedSakinah.jsx
          grep -q 'SavedLibrary' src/MergedSakinah.jsx
          grep -q '"islamic-search"' src/MergedSakinah.jsx
          grep -q '"saved-library"' src/MergedSakinah.jsx
          grep -q 'api.alquran.cloud/v1/search' src/searchLibrary.jsx
          grep -q 'sakinah-library-' src/searchLibrary.jsx
