name: Add Zakat Calculator
on:
  push:
    paths: ['.github/workflows/add-zakat-calculator.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add zakat and fitr calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function ZakatCalculator({' not in s:
              marker='function NearestMosque({' if 'function NearestMosque({' in s else 'function FeaturePreview('
              comp=r'''function ZakatCalculator({ lang, go }) {
  const [mode,setMode]=useState("wealth"),[cash,setCash]=useState(""),[gold,setGold]=useState(""),[silver,setSilver]=useState(""),[trade,setTrade]=useState(""),[debts,setDebts]=useState(""),[people,setPeople]=useState(1),[fitrPerPerson,setFitrPerPerson]=useState(0);
  const n=x=>Number(x)||0; const net=Math.max(0,n(cash)+n(gold)+n(silver)+n(trade)-n(debts)); const zakat=net*.025; const fitr=Math.max(0,people)*Math.max(0,n(fitrPerPerson));
  const field=(label,val,set)=><label style={{display:"block",marginTop:11}}><span style={{fontSize:11,opacity:.55}}>{label}</span><input inputMode="decimal" value={val} onChange={e=>set(e.target.value)} style={{marginTop:6,width:"100%",boxSizing:"border-box",padding:12,borderRadius:14,border:"1px solid rgba(16,16,15,.1)",background:"rgba(255,255,255,.46)",fontFamily:"inherit"}}/></label>;
  return <SectionShell lang={lang} go={go} back="discover" titleAr="ميزان الزكاة" titleEn="Zakat Calculator" subtitleAr="حساب زكاة المال وزكاة الفطر" subtitleEn="Calculate wealth Zakat and Zakat al-Fitr">
    <div style={{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}><button onClick={()=>setMode("wealth")} style={{padding:12,borderRadius:15,border:mode==="wealth"?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.1)",background:mode==="wealth"?"rgba(181,154,98,.1)":"transparent",fontFamily:"inherit"}}>{lang==="ar"?"زكاة المال":"Wealth Zakat"}</button><button onClick={()=>setMode("fitr")} style={{padding:12,borderRadius:15,border:mode==="fitr"?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.1)",background:mode==="fitr"?"rgba(181,154,98,.1)":"transparent",fontFamily:"inherit"}}>{lang==="ar"?"زكاة الفطر":"Zakat al-Fitr"}</button></div>
    {mode==="wealth"?<><div style={{marginTop:15}}>{field(lang==="ar"?"النقد والأرصدة":"Cash & balances",cash,setCash)}{field(lang==="ar"?"قيمة الذهب الزكوي":"Zakatable gold value",gold,setGold)}{field(lang==="ar"?"قيمة الفضة الزكوية":"Zakatable silver value",silver,setSilver)}{field(lang==="ar"?"عروض التجارة":"Trade inventory",trade,setTrade)}{field(lang==="ar"?"الديون المستحقة القابلة للخصم":"Eligible deductible debts",debts,setDebts)}</div><div style={{marginTop:18,borderRadius:20,padding:18,background:"rgba(181,154,98,.11)",border:"1px solid rgba(181,154,98,.20)"}}><div style={{fontSize:10,opacity:.48}}>{lang==="ar"?"صافي المال المدخل":"Entered net wealth"}</div><div className="font-editorial" style={{fontSize:28,marginTop:5}}>{net.toLocaleString()}</div><div style={{fontSize:10,opacity:.48,marginTop:13}}>{lang==="ar"?"٢٫٥٪ إذا تحققت شروط الوجوب والنصاب والحول":"2.5% when the applicable nisab and hawl conditions are met"}</div><div className="font-editorial" style={{fontSize:24,marginTop:5}}>{zakat.toLocaleString(undefined,{maximumFractionDigits:2})}</div></div></>:<><div style={{marginTop:16}}><label style={{fontSize:11,opacity:.55}}>{lang==="ar"?"عدد الأشخاص":"Number of people"}</label><input type="number" min="1" value={people} onChange={e=>setPeople(Number(e.target.value)||1)} style={{marginTop:6,width:"100%",boxSizing:"border-box",padding:12,borderRadius:14,border:"1px solid rgba(16,16,15,.1)",background:"rgba(255,255,255,.46)"}}/>{field(lang==="ar"?"المقدار المالي المعتمد للفرد في بلدك":"Local monetary amount per person",fitrPerPerson,setFitrPerPerson)}</div><div style={{marginTop:18,borderRadius:20,padding:18,background:"rgba(181,154,98,.11)",border:"1px solid rgba(181,154,98,.20)"}}><div style={{fontSize:10,opacity:.48}}>{lang==="ar"?"إجمالي زكاة الفطر":"Total Zakat al-Fitr"}</div><div className="font-editorial" style={{fontSize:28,marginTop:6}}>{fitr.toLocaleString(undefined,{maximumFractionDigits:2})}</div></div></>}
    <div style={{marginTop:14,fontSize:10.5,lineHeight:1.7,opacity:.48}}>{lang==="ar"?"الحاسبة أداة مساعدة. النصاب، الأموال الزكوية، خصم الديون، ومقدار زكاة الفطر قد تختلف تفاصيلها باختلاف الحال والقول الفقهي والجهة الشرعية المحلية.":"This calculator is an aid. Nisab, zakatable assets, deductible debts and Zakat al-Fitr details can vary by circumstances, jurisprudential view and local religious guidance."}</div>
  </SectionShell>;
}

'''
              s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"zakat-calculator":' not in s:s=s.replace(route,route+'\n    "zakat-calculator": () => <ZakatCalculator lang={lang} go={go} />,',1)
            needle='{ id: "nearest-mosque", label: lang === "ar" ? "أقرب مسجد" : "Nearest Mosque", action: () => go("nearest-mosque") },'
            entry='{ id: "zakat-calculator", label: lang === "ar" ? "ميزان الزكاة · زكاة الفطر" : "Zakat · Zakat al-Fitr", action: () => go("zakat-calculator") },'
            if needle in s and entry not in s:s=s.replace(needle,needle+'\n    '+entry,1)
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add Zakat and Zakat al-Fitr calculator" && git push; fi
