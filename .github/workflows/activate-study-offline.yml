name: Activate Study and Offline
on:
  push:
    paths:
      - 'src/liveStudy.jsx'
      - 'public/sw.js'
      - '.github/workflows/activate-study-offline.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Wire tafsir hadith gate and service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx');s=p.read_text()
          imp='import { LiveTafsirCenter, HadithNineBooksGate } from "./liveStudy.jsx";\n'
          if imp not in s:
            first=s.find('\n');s=s[:first+1]+imp+s[first+1:]
          s=s.replace('"tafsir-library": () => <TafsirLibrary lang={lang} go={go} />,','"tafsir-library": () => <LiveTafsirCenter lang={lang} go={go} />,')
          if '"hadith-nine":' not in s:
            anchor='"tafsir-hadith": () => <TafsirHadith lang={lang} go={go} />,'
            s=s.replace(anchor,anchor+'\n    "hadith-nine": () => <HadithNineBooksGate lang={lang} go={go} />,')
          p.write_text(s)
          m=Path('src/main.jsx');x=m.read_text()
          reg='''\nif (\"serviceWorker\" in navigator) {\n  window.addEventListener(\"load\", () => navigator.serviceWorker.register(\"/sw.js\").catch(()=>{}));\n}\n'''
          if 'navigator.serviceWorker.register("/sw.js")' not in x:x+=reg
          m.write_text(x)
          PY
      - run: npm ci
      - run: npm run build
      - name: Audit
        run: |
          grep -q 'LiveTafsirCenter' src/App.jsx
          grep -q 'HadithNineBooksGate' src/App.jsx
          grep -q 'edition/type/tafsir' src/liveStudy.jsx
          grep -q 'navigator.serviceWorker.register' src/main.jsx
          test -f public/sw.js
      - name: Commit verified wiring
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx src/main.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Activate live tafsir and offline cache"
            git push
          fi
