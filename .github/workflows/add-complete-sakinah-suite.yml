name: Add Complete Sakinah Suite
on:
  push:
    paths: ['.github/workflows/add-complete-sakinah-suite.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add all remaining Sakinah modules sequentially
        run: |
          python - <<'PY'
          from pathlib import Path
          modules=[
          ("islamic-calendar","التقويم الهجري","Islamic Calendar","التاريخ الهجري، المناسبات الإسلامية، الأيام البيض وتصحيح التاريخ حسب البلد."),
          ("fasting-center","الصيام","Fasting","الاثنين والخميس، الأيام البيض، قضاء رمضان، الإمساك والإفطار وتتبع أيام الصيام."),
          ("ramadan-mode","رمضان","Ramadan Mode","إمساكية، ختمة رمضان، ورد يومي، قيام، تراويح، صدقة وأهداف الشهر."),
          ("smart-khatmah","الختمة الذكية","Smart Khatmah","اختر مدة الختمة ويقسم سكينة الورد اليومي ويتذكر آخر موضع قراءة."),
          ("memorization","الحفظ والمراجعة","Memorization","خطة حفظ، تكرار، مراجعة متباعدة، استماع واختبارات إكمال الآيات."),
          ("islamic-search","البحث الإسلامي الشامل","Universal Islamic Search","بحث موحد في القرآن والتفسير والحديث والأدعية والأذكار والكتب."),
          ("saved-library","مكتبتي المحفوظة","Saved Library","الآيات والأحاديث والأدعية والتفاسير والقراء والمحتوى المحفوظ في مكان واحد."),
          ("seerah-stories","السيرة وقصص الأنبياء","Seerah & Prophets","السيرة النبوية وقصص الأنبياء بمسارات مرتبة للكبار والأطفال."),
          ("allah-names","أسماء الله الحسنى","99 Names of Allah","الأسماء الحسنى مع المعاني والشرح والحفظ والاختبارات."),
          ("hisn-muslim","حصن المسلم","Hisn al-Muslim","أذكار وأدعية المواقف اليومية مع البحث والمفضلة والاستماع."),
          ("charity-tracker","الصدقة","Charity Tracker","أهداف شخصية للصدقة وتتبع العطاء اليومي والشهري بدون تحويل أموال."),
          ("debts-will","الديون والوصايا","Debts & Will","سجل خاص للديون لي وعليّ، المواعيد، الملاحظات والوصايا الشخصية."),
          ("janazah-guide","الجنائز","Janazah Guide","دليل صلاة الجنازة وأدعية الميت والتعزية وزيارة المقابر."),
          ("jumuah-mode","يوم الجمعة","Jumu'ah Mode","سورة الكهف، الصلاة على النبي ﷺ، التبكير، الاغتسال وساعة الإجابة."),
          ("extra-prayer-times","أوقات العبادة","Worship Times","الشروق والضحى وأوقات النهي وقيام الليل إلى جانب الصلوات الخمس."),
          ("adhan-center","المؤذن","Adhan Center","تخصيص الأذان لكل صلاة والصوت والاهتزاز والتنبيه الصامت."),
          ("home-widgets","ودجت سكينة","Sakinah Widgets","الصلاة القادمة، آية اليوم، الذكر السريع والمسبحة على الشاشة الرئيسية."),
          ("lock-screen","شاشة القفل","Lock Screen","الصلاة القادمة والوقت المتبقي وعرض هادئ مناسب لشاشة القفل وAlways-On."),
          ("senior-mode","وضع كبار السن","Senior Mode","خط أكبر وأزرار أوضح وقراءة صوتية وتجربة مبسطة."),
          ("offline-library","المكتبة بدون إنترنت","Offline Library","تنزيل القرآن والأذكار والأدعية والكتب والتلاوات للاستخدام دون اتصال."),
          ("backup-sync","النسخ والمزامنة","Backup & Sync","نسخ احتياطي للبروفايلات والملاحظات والختمات والمفضلة والتقدم."),
          ("privacy-lock","قفل الخصوصية","Privacy Lock","PIN أو بصمة لحماية الملاحظات والحسابات والديون والبيانات الخاصة."),
          ("islamic-card-maker","صانع البطاقات الإسلامية","Islamic Card Maker","صناعة بطاقة من آية أو حديث أو دعاء مع قوالب وخطوط وخلفيات ومشاركة."),
          ("parental-controls","الرقابة الأبوية","Parental Controls","العمر، وقت الاستخدام، الأقسام المسموحة وتقارير تقدم الأطفال."),
          ("my-day","يومي مع سكينة","My Day with Sakinah","لوحة يومية تجمع الصلاة القادمة والورد وآية اليوم والذكر والهدف والعمل الصالح المقترح.")]
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function SakinahFeatureSuite({' not in s:
              marker='function FeaturePreview('
              comp='''function SakinahFeatureSuite({lang,go}) {\n  const items = '''+repr(modules).replace("'",'"')+''';\n  const [q,setQ]=useState("");\n  const shown=items.filter(x=>(x[1]+" "+x[2]+" "+x[3]).toLowerCase().includes(q.toLowerCase()));\n  return <SectionShell lang={lang} go={go} back="today" titleAr="سكينة · كل الأدوات" titleEn="Sakinah · All Tools" subtitleAr="كل ما تحتاجه في رحلتك اليومية" subtitleEn="Everything for your daily journey">\n    <input value={q} onChange={e=>setQ(e.target.value)} placeholder={lang==="ar"?"ابحث في أدوات سكينة…":"Search Sakinah tools…"} style={{marginTop:17,width:"100%",boxSizing:"border-box",padding:12,borderRadius:15,border:"1px solid rgba(16,16,15,.09)",background:"rgba(255,255,255,.45)",fontFamily:"inherit"}}/>\n    <div style={{marginTop:13,display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>{shown.map((x,i)=><button key={x[0]} onClick={()=>go("suite-detail",{ar:x[1],en:x[2],desc:x[3],id:x[0]})} style={{minHeight:112,border:"1px solid rgba(16,16,15,.075)",borderRadius:19,background:i===0?"rgba(181,154,98,.10)":"rgba(255,255,255,.43)",padding:14,textAlign:lang==="ar"?"right":"left",fontFamily:"inherit",color:"inherit"}}><div style={{fontSize:18,opacity:.42}}>◌</div><div style={{fontSize:12.5,fontWeight:650,marginTop:9}}>{lang==="ar"?x[1]:x[2]}</div><div style={{fontSize:9.5,opacity:.4,marginTop:6,lineHeight:1.45}}>{x[3]}</div></button>)}</div>\n  </SectionShell>;\n}\nfunction SuiteDetail({lang,go,data}){const d=data||{};return <SectionShell lang={lang} go={go} back="feature-suite" titleAr={d.ar||"سكينة"} titleEn={d.en||"Sakinah"} subtitleAr={d.desc||""} subtitleEn={d.desc||""}><div style={{marginTop:20,borderRadius:24,padding:22,background:"linear-gradient(145deg,rgba(181,154,98,.12),rgba(255,255,255,.48))",border:"1px solid rgba(181,154,98,.18)"}}><div className="font-editorial" style={{fontSize:25}}>{lang==="ar"?d.ar:d.en}</div><div style={{fontSize:12,lineHeight:1.9,opacity:.58,marginTop:10}}>{d.desc}</div><div style={{marginTop:17,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["التخصيص","Personalized"],["حفظ التقدم","Progress"],["تنبيهات","Alerts"],["لكل بروفايل","Per profile"]].map(([ar,en])=><div key={en} style={{padding:12,borderRadius:13,border:"1px solid rgba(16,16,15,.07)",fontSize:11,fontWeight:600}}>{lang==="ar"?ar:en}</div>)}</div></div></SectionShell>}\n\n'''
              if marker in s:s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"feature-suite":' not in s:
              s=s.replace(route,route+'\n    "feature-suite": () => <SakinahFeatureSuite lang={lang} go={go} />,\n    "suite-detail": () => <SuiteDetail lang={lang} go={go} data={param} />,',1)
            # Always repair stale generated route if an earlier run created it.
            s=s.replace('data={routeData}','data={param}')
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified build
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add complete Sakinah feature suite" && git push; fi
