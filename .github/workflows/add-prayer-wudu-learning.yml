name: Add Prayer and Wudu Learning

on:
  push:
    paths: ['.github/workflows/add-prayer-wudu-learning.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add multilingual learning center
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function PrayerWuduLearning({' not in s:
              marker='function TafsirLibrary({' if 'function TafsirLibrary({' in s else 'function FeaturePreview('
              comp=r'''function PrayerWuduLearning({ lang, go }) {
  const [course,setCourse]=useState("prayer");
  const [lessonLang,setLessonLang]=useState(lang==="ar"?"العربية":"English");
  const languages=["العربية","English","Türkçe","اردو","فارسی","Bahasa Indonesia","Bahasa Melayu","Français","Deutsch","Español","Русский","हिन्दी","বাংলা","中文","Swahili"];
  const prayer=["النية والاستعداد","القيام واستقبال القبلة","تكبيرة الإحرام","القيام والقراءة","الركوع","الرفع من الركوع","السجود","الجلوس بين السجدتين","الركعة التالية","التشهد","الصلاة الإبراهيمية","التسليم"];
  const wudu=["النية والتسمية","غسل الكفين","المضمضة","الاستنشاق والاستنثار","غسل الوجه","غسل اليدين إلى المرفقين","مسح الرأس والأذنين","غسل الرجلين إلى الكعبين","الذكر بعد الوضوء"];
  const steps=course==="prayer"?prayer:wudu;
  return <SectionShell lang={lang} go={go} back="discover" titleAr="تعليم الصلاة والوضوء" titleEn="Learn Prayer & Wudu" subtitleAr="تعليم خطوة بخطوة بعدة لغات" subtitleEn="Step-by-step guidance in multiple languages">
    <div style={{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["prayer","الصلاة","Prayer"],["wudu","الوضوء","Wudu"]].map(([id,ar,en])=><button key={id} onClick={()=>setCourse(id)} style={{border:course===id?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.1)",background:course===id?"rgba(181,154,98,.1)":"rgba(255,255,255,.4)",borderRadius:16,padding:13,fontFamily:"inherit",fontWeight:600}}>{lang==="ar"?ar:en}</button>)}</div>
    <div style={{marginTop:14}}><select value={lessonLang} onChange={e=>setLessonLang(e.target.value)} style={{width:"100%",padding:"12px 13px",borderRadius:14,border:"1px solid rgba(16,16,15,.1)",background:"rgba(255,255,255,.48)",fontFamily:"inherit"}}>{languages.map(x=><option key={x}>{x}</option>)}</select></div>
    <div style={{marginTop:18}}>{steps.map((x,i)=><div key={x} style={{display:"grid",gridTemplateColumns:"34px 1fr auto",gap:11,alignItems:"center",padding:"13px 0",borderTop:"1px solid rgba(16,16,15,.08)"}}><div style={{width:30,height:30,border:"1px solid rgba(16,16,15,.14)",borderRadius:"50%",display:"grid",placeItems:"center",fontSize:10}}>{nDigits(i+1,lang)}</div><div><div style={{fontSize:13.5,fontWeight:600}}>{x}</div><div style={{fontSize:10.5,opacity:.45,marginTop:4}}>{lessonLang} · {lang==="ar"?"شرح مرئي وصوتي":"Visual & audio guide"}</div></div><Play size={15} opacity={.45}/></div>)}</div>
    <div style={{marginTop:18,display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>{[["صور توضيحية","Visual guide"],["صوت","Audio"],["نطق الأذكار","Recitation"],["وضع الأطفال","Kids mode"],["اختبار تفاعلي","Interactive quiz"],["عمل دون إنترنت","Offline"]].map(([ar,en])=><div key={en} style={{border:"1px solid rgba(16,16,15,.08)",borderRadius:14,padding:13}}><div style={{fontSize:12,fontWeight:600}}>{lang==="ar"?ar:en}</div><div style={{marginTop:7}}><FeatureStatus lang={lang} status="verified"/></div></div>)}</div>
  </SectionShell>;
}

'''
              s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"prayer-wudu-learning":' not in s:
              s=s.replace(route,route+'\n    "prayer-wudu-learning": () => <PrayerWuduLearning lang={lang} go={go} />,',1)
            # Add direct Discover entry after Quran platform
            needle='{ id: "quran-platform", label: lang === "ar" ? "منصة القرآن" : "Quran Platform", action: () => go("quran-platform") },'
            entry='{ id: "prayer-learning", label: lang === "ar" ? "تعليم الصلاة والوضوء" : "Learn Prayer & Wudu", action: () => go("prayer-wudu-learning") },'
            if needle in s and entry not in s: s=s.replace(needle,needle+'\n    '+entry,1)
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified build
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add multilingual prayer and wudu learning" && git push; fi
