name: Add Personal Accounts Ledger
on:
  push:
    paths: ['.github/workflows/add-personal-ledger.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add ledger
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function PersonalLedger({' not in s:
              marker='function SakinahNotebook({' if 'function SakinahNotebook({' in s else 'function FeaturePreview('
              comp=r'''function PersonalLedger({lang,go}){
  const profile=(()=>{try{return localStorage.getItem("sakinah-active-profile")||"me"}catch{return "me"}})();const key=`sakinah-ledger-${profile}`;
  const [rows,setRows]=useState(()=>{try{return JSON.parse(localStorage.getItem(key))||[]}catch{return []}}),[type,setType]=useState("expense"),[amount,setAmount]=useState(""),[title,setTitle]=useState(""),[cat,setCat]=useState("عام"),[q,setQ]=useState("");
  const persist=x=>{setRows(x);try{localStorage.setItem(key,JSON.stringify(x))}catch{}};const add=()=>{const v=Number(amount);if(!v||!title.trim())return;persist([{id:Date.now(),type,amount:v,title:title.trim(),cat,date:new Date().toISOString()},...rows]);setAmount("");setTitle("")};
  const income=rows.filter(x=>x.type==="income").reduce((a,x)=>a+x.amount,0),expense=rows.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amount,0),balance=income-expense;const shown=rows.filter(x=>(x.title+x.cat).toLowerCase().includes(q.toLowerCase()));
  return <SectionShell lang={lang} go={go} back="home" titleAr="دفتر الحسابات" titleEn="Accounts Ledger" subtitleAr="دخل · مصروف · ديون · ومتابعة الرصيد" subtitleEn="Income · expenses · debts · balance tracking">
    <div style={{marginTop:18,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>{[[lang==="ar"?"الدخل":"Income",income],[lang==="ar"?"المصروف":"Expenses",expense],[lang==="ar"?"الرصيد":"Balance",balance]].map(([l,v],i)=><div key={l} style={{padding:13,borderRadius:16,border:"1px solid rgba(16,16,15,.08)",background:i===2?"rgba(181,154,98,.10)":"rgba(255,255,255,.42)"}}><div style={{fontSize:9.5,opacity:.45}}>{l}</div><div className="font-editorial" style={{fontSize:19,marginTop:6}}>{Number(v).toLocaleString()}</div></div>)}</div>
    <div style={{marginTop:14,border:"1px solid rgba(16,16,15,.08)",borderRadius:19,padding:14}}><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>{[["expense","مصروف","Expense"],["income","دخل","Income"]].map(([id,ar,en])=><button key={id} onClick={()=>setType(id)} style={{padding:9,borderRadius:12,border:type===id?`1px solid ${COLOR.gold}`:"1px solid rgba(16,16,15,.08)",background:type===id?"rgba(181,154,98,.1)":"transparent",fontFamily:"inherit"}}>{lang==="ar"?ar:en}</button>)}</div><input value={title} onChange={e=>setTitle(e.target.value)} placeholder={lang==="ar"?"البيان، مثلاً: تسوق":"Description, e.g. groceries"} style={{marginTop:9,width:"100%",boxSizing:"border-box",padding:11,borderRadius:13,border:"1px solid rgba(16,16,15,.08)",background:"transparent",fontFamily:"inherit"}}/><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}><input inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)} placeholder={lang==="ar"?"المبلغ":"Amount"} style={{padding:11,borderRadius:13,border:"1px solid rgba(16,16,15,.08)",background:"transparent",fontFamily:"inherit",minWidth:0}}/><select value={cat} onChange={e=>setCat(e.target.value)} style={{padding:11,borderRadius:13,border:"1px solid rgba(16,16,15,.08)",background:"transparent",fontFamily:"inherit",minWidth:0}}>{["عام","منزل","طعام","مواصلات","صحة","تعليم","صدقة","دين"].map(x=><option key={x}>{x}</option>)}</select></div><button onClick={add} style={{width:"100%",marginTop:9,padding:11,border:0,borderRadius:14,background:COLOR.lapis,color:"white",fontFamily:"inherit",fontWeight:600}}>{lang==="ar"?"إضافة للحسابات":"Add transaction"}</button></div>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder={lang==="ar"?"بحث في الحسابات…":"Search ledger…"} style={{marginTop:13,width:"100%",boxSizing:"border-box",padding:11,borderRadius:13,border:"1px solid rgba(16,16,15,.08)",background:"rgba(255,255,255,.4)",fontFamily:"inherit"}}/>
    <div style={{marginTop:8}}>{shown.map(x=><div key={x.id} style={{display:"grid",gridTemplateColumns:"1fr auto auto",gap:10,alignItems:"center",padding:"12px 2px",borderTop:"1px solid rgba(16,16,15,.07)"}}><div><b style={{fontSize:12.5}}>{x.title}</b><small style={{display:"block",opacity:.42,marginTop:4}}>{x.cat} · {new Date(x.date).toLocaleDateString()}</small></div><b style={{fontSize:12.5}}>{x.type==="income"?"+":"−"}{x.amount.toLocaleString()}</b><button onClick={()=>persist(rows.filter(r=>r.id!==x.id))} style={{border:0,background:"transparent",opacity:.35}}>×</button></div>)}</div>
  </SectionShell>;
}

'''
              s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"personal-ledger":' not in s:s=s.replace(route,route+'\n    "personal-ledger": () => <PersonalLedger lang={lang} go={go} />,',1)
            needle='{ id: "notebook", label: lang === "ar" ? "دفتر ملاحظاتي" : "My Notebook", action: () => go("notebook") },'
            entry='{ id: "personal-ledger", label: lang === "ar" ? "دفتر الحسابات" : "Accounts Ledger", action: () => go("personal-ledger") },'
            if needle in s and entry not in s:s=s.replace(needle,needle+'\n    '+entry,1)
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add personal accounts ledger" && git push; fi
