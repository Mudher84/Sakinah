name: Add Nearest Mosque
on:
  push:
    paths: ['.github/workflows/add-nearest-mosque.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Add nearest mosque experience
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['Sakinah-RC4-AllFeatures-Showcase.jsx','src/App.jsx']:
            p=Path(fn); s=p.read_text()
            if 'function NearestMosque({' not in s:
              marker='function NasheedPlayer({' if 'function NasheedPlayer({' in s else 'function FeaturePreview('
              comp=r'''function NearestMosque({ lang, go }) {
  const [geo,setGeo]=useState({status:"idle",lat:null,lon:null});
  const locate=()=>{if(!navigator.geolocation){setGeo({status:"unsupported"});return}setGeo({status:"loading",lat:null,lon:null});navigator.geolocation.getCurrentPosition(p=>setGeo({status:"ready",lat:p.coords.latitude,lon:p.coords.longitude}),()=>setGeo({status:"denied",lat:null,lon:null}),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})};
  useEffect(()=>locate(),[]);
  const maps=geo.status==="ready"?`https://www.google.com/maps/search/mosque/@${geo.lat},${geo.lon},15z`:"https://www.google.com/maps/search/mosque";
  return <SectionShell lang={lang} go={go} back="discover" titleAr="أقرب مسجد" titleEn="Nearest Mosque" subtitleAr="اعثر على المساجد القريبة من موقعك" subtitleEn="Find mosques close to your location">
    <div style={{marginTop:20,borderRadius:26,padding:22,background:"linear-gradient(145deg,rgba(181,154,98,.14),rgba(255,255,255,.48))",border:"1px solid rgba(181,154,98,.20)",textAlign:"center"}}><div style={{fontSize:38}}>⌖</div><div className="font-editorial" style={{fontSize:22,marginTop:10}}>{geo.status==="ready"?(lang==="ar"?"تم تحديد موقعك":"Location ready"):geo.status==="loading"?(lang==="ar"?"جاري تحديد موقعك…":"Locating you…"):(lang==="ar"?"فعّل الموقع للعثور على أقرب مسجد":"Enable location to find the nearest mosque")}</div><div style={{fontSize:10.5,opacity:.45,marginTop:8}}>{geo.status==="ready"?`${geo.lat.toFixed(4)} · ${geo.lon.toFixed(4)}`:(lang==="ar"?"نستخدم موقع الجهاز عند الطلب فقط":"Uses device location on request")}</div><button onClick={locate} style={{marginTop:16,border:0,borderRadius:16,padding:"12px 18px",background:COLOR.lapis,color:"white",fontFamily:"inherit",fontWeight:600}}>{lang==="ar"?"تحديث الموقع":"Refresh location"}</button></div>
    <div style={{marginTop:14,display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>{[["المسافة","Distance"],["وقت الوصول","ETA"],["اتجاه المسجد","Direction"],["الملاحة","Navigation"]].map(([ar,en])=><div key={en} style={{border:"1px solid rgba(16,16,15,.08)",borderRadius:14,padding:13,minHeight:68}}><div style={{fontSize:12,fontWeight:600}}>{lang==="ar"?ar:en}</div><div style={{fontSize:10,opacity:.42,marginTop:7}}>{geo.status==="ready"?(lang==="ar"?"جاهز للبحث":"Ready"):(lang==="ar"?"بانتظار الموقع":"Waiting")}</div></div>)}</div>
    <a href={maps} target="_blank" rel="noreferrer" style={{display:"block",marginTop:14,textDecoration:"none",textAlign:"center",border:"1px solid rgba(16,16,15,.10)",borderRadius:16,padding:13,color:"inherit",fontSize:12,fontWeight:600}}>{lang==="ar"?"فتح المساجد القريبة على الخريطة":"Open nearby mosques on map"}</a>
  </SectionShell>;
}

'''
              s=s.replace(marker,comp+marker,1)
            route='    "complete-vision": () => <CompleteVisionCenter lang={lang} go={go} />,'
            if route in s and '"nearest-mosque":' not in s:s=s.replace(route,route+'\n    "nearest-mosque": () => <NearestMosque lang={lang} go={go} />,',1)
            needle='{ id: "daily-reflection", label: lang === "ar" ? "تأمّل · آية اليوم" : "Reflect · Ayah of the Day", action: () => go("daily-reflection") },'
            entry='{ id: "nearest-mosque", label: lang === "ar" ? "أقرب مسجد" : "Nearest Mosque", action: () => go("nearest-mosque") },'
            if needle in s and entry not in s:s=s.replace(needle,needle+'\n    '+entry,1)
            p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Sakinah-RC4-AllFeatures-Showcase.jsx src/App.jsx
          if ! git diff --cached --quiet; then git commit -m "Add nearest mosque location experience" && git push; fi
