name: Activate Live Core
on:
  push:
    paths:
      - 'src/liveCore.jsx'
      - '.github/workflows/activate-live-core.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Wire live Quran and prayer routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.jsx')
          s=p.read_text()
          imp='import { LivePrayerCenter, LiveQuranReader, LiveSurahList } from "./liveCore.jsx";\n'
          if imp not in s:
              first=s.find('\n')
              s=s[:first+1]+imp+s[first+1:]
          s=s.replace('"surah-list": () => <SurahList lang={lang} go={go} />,','"surah-list": () => <LiveSurahList lang={lang} go={go} />,')
          old='"reader": () => <QuranReader lang={lang} surahId={param.surahId || 1} go={go} lastRead={lastRead} setLastRead={setLastRead} bookmarks={bookmarks} toggleBookmark={toggleBookmark} quranScale={a11y.quranScale} />,'
          s=s.replace(old,'"reader": () => <LiveQuranReader lang={lang} surahId={param.surahId || 1} go={go} />,')
          oldp='"prayer": () => <PrayerScreen lang={lang} hourNow={hourNow} go={go} onScrub={(h) => setPreview(h)} onQiblaDeg={setQiblaDeg} />,'
          s=s.replace(oldp,'"prayer": () => <LivePrayerCenter lang={lang} go={go} />,')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Live-core audit
        run: |
          grep -q 'LiveSurahList' src/App.jsx
          grep -q 'LiveQuranReader' src/App.jsx
          grep -q 'LivePrayerCenter' src/App.jsx
          grep -q 'api.alquran.cloud' src/liveCore.jsx
          grep -q 'api.aladhan.com' src/liveCore.jsx
      - name: Commit verified wiring
        run: |
          git config user.name "Sakinah Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx
          if ! git diff --cached --quiet; then
            git commit -m "Activate live Quran and prayer core"
            git push
          fi
